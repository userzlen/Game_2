<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>DBD 3D — Multiplayer (FPS)</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050810;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;}
  #game{display:block;position:absolute;inset:0;width:100vw;height:100vh;cursor:crosshair;}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-size:13px;}
  .hud-top{position:absolute;top:0;left:0;right:0;height:64px;background:linear-gradient(180deg,rgba(5,8,14,0.9),rgba(5,8,14,0));padding:8px 16px;display:flex;gap:24px;align-items:center;}
  .hud-block{display:flex;flex-direction:column;gap:2px;}
  .hud-label{font-size:10px;color:#7a90a8;letter-spacing:2px;text-transform:uppercase;}
  .hud-value{font-size:15px;font-weight:bold;}
  .hud-value.green{color:#88ffaa;}
  .hud-value.red{color:#ff5555;}
  .hud-value.blue{color:#6aafff;}
  .gen-row{display:flex;gap:3px;align-items:center;}
  .gen-dot{width:16px;height:6px;background:#333;border-radius:2px;}
  .gen-dot.partial{background:#ffaa44;}
  .gen-dot.done{background:#66ff88;}
  #hint{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:rgba(5,10,20,0.9);border:1px solid rgba(100,180,255,0.5);padding:10px 20px;border-radius:6px;font-weight:bold;font-size:16px;display:none;}
  #hint.show{display:block;}
  #bottom{position:absolute;bottom:12px;left:16px;color:rgba(120,150,180,0.7);font-size:11px;}
  #screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.92);pointer-events:auto;padding:20px;text-align:center;z-index:20;overflow-y:auto;}
  #screen.show{display:flex;}
  #screen h1{font-size:44px;margin:0 0 12px;letter-spacing:4px;text-shadow:0 0 30px currentColor;}
  #screen h2{font-size:18px;margin:0 0 24px;color:#88a0b8;font-weight:400;}
  .btn{background:#1a3a5a;color:#fff;border:2px solid #5a9ad0;padding:14px 32px;font-size:18px;font-weight:bold;border-radius:6px;cursor:pointer;margin:8px;transition:all 0.15s;letter-spacing:2px;font-family:inherit;}
  .btn:hover{background:#3a7ac0;transform:translateY(-2px);}
  .btn.green{background:#1a4a2a;border-color:#4aaa6a;}
  .btn.green:hover{background:#3a8a4a;}
  .btn.red{background:#4a1010;border-color:#aa4040;}
  .btn.red:hover{background:#8a2a2a;}
  .btn.blue{background:#0a1a3a;border-color:#4a6a9a;}
  .btn.blue:hover{background:#1a3a6a;}
  .card-grid{display:grid;gap:12px;margin:16px 0;max-width:1200px;}
  .card{background:rgba(20,30,45,0.9);border:2px solid #2a4a6a;border-radius:8px;padding:12px;cursor:pointer;transition:all 0.15s;text-align:left;}
  .card:hover{border-color:#5a9ad0;background:rgba(30,50,75,0.9);}
  .card.selected{border-color:#5a9ad0;background:rgba(40,70,110,0.9);box-shadow:0 0 20px rgba(90,154,208,0.4);}
  .card-icon{font-size:32px;margin-bottom:4px;}
  .card-name{font-size:14px;font-weight:bold;color:#a0c8f0;margin-bottom:4px;}
  .card-desc{font-size:11px;color:#8098b0;line-height:1.4;}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#050810;z-index:30;}
  #loading.hidden{display:none !important;}
  #loading h1{color:#8ab4ff;letter-spacing:8px;font-size:32px;margin:0 0 12px;}
  #loading p{color:#5a7088;font-size:14px;margin:4px 0;}
  .spinner{width:48px;height:48px;border:4px solid #2a4a6a;border-top-color:#8ab4ff;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#1a0505;z-index:40;padding:40px;text-align:left;}

  .invite-url{font-family:monospace;font-size:13px;color:#88aaff;padding:10px 16px;background:#0a1a2a;border:1px solid #2a4a6a;border-radius:6px;margin:8px 0;max-width:90vw;overflow:auto;user-select:all;word-break:break-all;}
  #status{font-size:14px;color:#88a0b8;margin:12px 0;}
  #mp-indicator{position:absolute;top:8px;right:8px;font-size:11px;padding:4px 10px;background:rgba(0,0,0,0.7);border:1px solid #2a4a6a;border-radius:4px;color:#88a0b8;z-index:11;}

'use strict';

function log(m){ try{ console.log('[DBD3D]', m); }catch(_){} }
function fatal(title, err){
  console.error('[DBD3D FATAL]', title, err);
  const el = document.getElementById('fatal');
  const msg = document.getElementById('fatalMsg');
  if (!el || !msg) return;
  let text = title + '\n\n';
  if (err){
    if (typeof err === 'string') text += err;
    else if (err.message) text += err.message + '\n\n' + (err.stack || '');
    else text += String(err);
  }
  text += '\n\n--- ПРОВЕРЬ ---\n1. F12 — консоль\n2. Интернет для CDN\n3. HTTPS для мультиплеера';
  msg.textContent = text;
  el.classList.add('show');
  const ld = document.getElementById('loading');
  if (ld) ld.classList.add('hidden');
}
window.addEventListener('error', e => { if (e.error && !e.error._dbdHandled) fatal('Ошибка', e.error || e.message); });

async function ensureSupabaseAuth(){
  const current = await SB.auth.getSession();
  if (current.error) throw current.error;
  if (!current.data.session) {
    const signed = await SB.auth.signInAnonymously();
    if (signed.error) throw signed.error;
  }
  const session = await SB.auth.getSession();
  if (!session.data.session) throw new Error('Не удалось создать анонимную сессию Supabase');
  return session.data.session.user.id;
}

function withTimeout(promise, ms, message){
  let timer;
  return Promise.race([
    promise,
    new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); })
  ]).finally(() => clearTimeout(timer));
}

function genRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const bytes = new Uint8Array(6);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
  else for (let i=0;i<bytes.length;i++) bytes[i] = Math.floor(Math.random()*256);
  return Array.from(bytes, b => chars[b % chars.length]).join('');
}

function makeDataConnection(channel){
  const handlers = new Map();
  const emit = (name, value) => {
    const list = handlers.get(name) || [];
    for (const fn of list) { try { fn(value); } catch (err) { console.error('MP handler error', err); } }
  };
  const conn = {
    on(name, fn){
      if (!handlers.has(name)) handlers.set(name, []);
      handlers.get(name).push(fn);
      if (name === 'open' && channel.readyState === 'open') queueMicrotask(() => fn());
      return conn;
    },
    send(value){
      if (channel.readyState !== 'open') throw new Error('Канал передачи данных не открыт');
      channel.send(JSON.stringify(value));
    },
    close(){ try { channel.close(); } catch(_){} }
  };
  channel.addEventListener('open', () => emit('open'));
  channel.addEventListener('message', event => {
    try { emit('data', JSON.parse(event.data)); }
    catch (err) { console.warn('Некорректный пакет от второго игрока', err); }
  });
  channel.addEventListener('close', () => emit('close'));
  channel.addEventListener('error', event => emit('error', event));
  return conn;
}

function createRtcPeerConnection(){
  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.cloudflare.com:3478' },
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun.services.mozilla.com' }
    ],
    iceCandidatePoolSize: 4
  });
  MP.pc = pc;
  pc.onicecandidate = event => {
    if (event.candidate) {
      sendRoomSignal('ice', event.candidate.toJSON()).catch(err => console.warn('Не удалось отправить ICE-кандидат', err));
    }
  };
  pc.onconnectionstatechange = () => {
    log('WebRTC connection: ' + pc.connectionState);
    if (pc.connectionState === 'connected') {
      if (MP.pollTimer) clearInterval(MP.pollTimer);
      MP.pollTimer = null;
    }
    if (pc.connectionState === 'failed') {
      MP.connected = false;
      MP.connReady = false;
      game.hint = 'Не удалось установить P2P-соединение. Попробуйте снова.';
      game.hintTime = 6;
    } else if (pc.connectionState === 'disconnected') {
      game.hint = 'Связь прервалась, ожидаем восстановление…';
      game.hintTime = 5;
    }
  };
  return pc;
}

async function flushPendingIce(){
  if (!MP.pc || !MP.pc.remoteDescription) return;
  const queued = MP.pendingIce.splice(0);
  for (const candidate of queued) {
    try { await MP.pc.addIceCandidate(new RTCIceCandidate(candidate)); }
    catch (err) { console.warn('ICE candidate rejected', err); }
  }
}

async function handleRoomSignal(signal){
  const payload = signal.payload || {};
  if (signal.kind === 'ready' && MP.role === 'host') {
    if (MP.offerStarted) return;
    MP.offerStarted = true;
    const pc = createRtcPeerConnection();
    const channel = pc.createDataChannel('game-data', { ordered: true });
    MP.conn = makeDataConnection(channel);
    setupConnection(MP.conn);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await sendRoomSignal('offer', pc.localDescription.toJSON());
    return;
  }

  if (signal.kind === 'offer' && MP.role === 'guest') {
    if (MP.pc) return;
    const pc = createRtcPeerConnection();
    pc.ondatachannel = event => {
      MP.conn = makeDataConnection(event.channel);
      setupConnection(MP.conn);
    };
    await pc.setRemoteDescription(new RTCSessionDescription(payload));
    await flushPendingIce();
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await sendRoomSignal('answer', pc.localDescription.toJSON());
    return;
  }

  if (signal.kind === 'answer' && MP.role === 'host' && MP.pc) {
    if (!MP.pc.remoteDescription) {
      await MP.pc.setRemoteDescription(new RTCSessionDescription(payload));
      await flushPendingIce();
    }
    return;
  }

  if (signal.kind === 'ice') {
    if (!MP.pc || !MP.pc.remoteDescription) MP.pendingIce.push(payload);
    else {
      try { await MP.pc.addIceCandidate(new RTCIceCandidate(payload)); }
      catch (err) { console.warn('ICE candidate rejected', err); }
    }
    return;
  }

  if (signal.kind === 'leave') {
    MP.connected = false;
    MP.connReady = false;
    game.hint = 'Друг отключился';
    game.hintTime = 5;
  }
}

async function pollRoomSignals(){
  if (!MP.active || !MP.roomId || MP.pollBusy) return;
  MP.pollBusy = true;
  try {
    const { data, error } = await SB.rpc('get_game_signals', {
      p_room_id: MP.roomId, p_after_id: MP.lastSignalId
    });
    if (error) throw error;
    for (const signal of (data || [])) {
      MP.lastSignalId = Math.max(MP.lastSignalId, Number(signal.signal_id) || 0);
      await handleRoomSignal(signal);
    }
  } catch (err) {
    console.warn('Ошибка опроса сигналов Supabase', err);
  } finally {
    MP.pollBusy = false;
  }
}

function startSignalPolling(){
  if (MP.pollTimer) clearInterval(MP.pollTimer);
  MP.pollTimer = setInterval(pollRoomSignals, 450);
  pollRoomSignals();
}

async function hostRoom(myRole){
  await ensureSupabaseAuth();
  MP.active = true;
  MP.role = 'host';
  MP.myRole = myRole;
  MP.offerStarted = false;
  MP.lastSignalId = 0;
  MP.pendingIce = [];
  let roomId = null, code = null;
  for (let attempt=0; attempt<8; attempt++) {
    code = genRoomCode();
    const result = await withTimeout(
      SB.rpc('create_game_room', { p_code: code }),
      12000,
      'Сервер не ответил за 12 секунд. Проверьте подключение и повторите попытку.'
    );
    if (!result.error) { roomId = result.data; break; }
    if (!String(result.error.message || result.error).includes('ROOM_CODE_TAKEN')) throw result.error;
  }
  if (!roomId) throw new Error('Не удалось подобрать свободный код комнаты. Попробуйте ещё раз.');
  MP.roomCode = code.toLowerCase();
  MP.roomId = roomId;
  startSignalPolling();
  return { code: MP.roomCode, url: buildInviteUrl(MP.roomCode) };
}

async function joinRoom(code, myRole){
  await ensureSupabaseAuth();
  MP.active = true;
  MP.role = 'guest';
  MP.myRole = myRole;
  MP.roomCode = code.toLowerCase();
  MP.lastSignalId = 0;

  const joined = await withTimeout(
    SB.rpc('join_game_room', { p_code: code.toUpperCase() }),
    12000,
    'Сервер не ответил за 12 секунд.'
  );
  if (joined.error) throw joined.error;
  MP.roomId = joined.data;
  startSignalPolling();

  return withTimeout(new Promise(async (resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('Не удалось подключиться за 20 секунд. Проверьте код комнаты и попробуйте снова.')), 20000);
    MP.onConnected = () => { clearTimeout(timer); MP.onConnected = null; resolve(); };
    try { await sendRoomSignal('ready', {}); }
    catch (err) { clearTimeout(timer); MP.onConnected = null; reject(err); }
  }), 20500, 'Превышено время ожидания подключения.');
}

function setupConnection(conn){
  conn.on('open', () => {
    MP.connReady = true;
    MP.connected = true;
    if (MP.onConnected) { const done = MP.onConnected; MP.onConnected = null; done(); }
    game.hint = 'Соединение установлено!';
    game.hintTime = 3;
    if (MP.role === 'host') {
      if (game.screen !== 'playing') {
        const guestRole = MP.myRole === 'survivor' ? 'killer' : 'survivor';
        conn.send({ type: 'start', guestRole: guestRole });
        beginPlaying();
      }
    }
  });
  conn.on('data', (data) => {
    if (MP.role === 'host') {
      if (data.type === 'input') MP.remoteInput = data.input;
    } else {
      if (data.type === 'state') { MP.remoteState = data.state; applyStateToWorld(data.state); }
      else if (data.type === 'start') {
        MP.myRole = data.guestRole;
        beginPlaying();
      } else if (data.type === 'end') {
        game.screen = data.screen;
        if (data.screen === 'win') showEndScreen('ПОБЕГ', 'Ты сбежал', '#7fffa8');
        else showEndScreen('ПОЙМАН', 'Тебя поймали', '#ff5050');
      }
    }
  });
  conn.on('close', () => {
    MP.connected = false;
    MP.connReady = false;
    if (MP.role === 'guest' && MP.roomId) {
      SB.rpc('leave_game_room', { p_room_id: MP.roomId })
        .then(({error}) => { if (error) console.warn('Не удалось освободить комнату', error); });
    }
    game.hint = 'Соединение потеряно';
    game.hintTime = 5;
  });
  conn.on('error', (err) => {
    console.error('Conn error', err);
  });
}

function buildForestSetDressing(){
  // Deterministic, instanced ground detail: richer forest floor without hundreds of draw calls.

  const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  const clearSpot=(x,y,pad=52)=>{
    if(Math.hypot(x-150,y-150)<pad+90||Math.hypot(x-2250,y-1450)<pad+90)return false;
    for(const g of generators)if(Math.hypot(x-g.x,y-g.y)<pad+82)return false;
    if(Math.hypot(x-totem.x,y-totem.y)<pad+42)return false;
    for(const p of pallets)if(Math.hypot(x-p.x,y-p.y)<pad+48)return false;
    for(const e of exitDoors)if(circleRect(x,y,pad,e.x-20,e.y-20,e.w+40,e.h+40))return false;

  const dummy=new THREE.Object3D();
  const grassGeo=new THREE.ConeGeometry(0.022,0.17,3);

  const stoneGeo=new THREE.IcosahedronGeometry(0.12,0);

  for(const [x,y] of [[100,350],[2300,350],[100,1250],[2300,1250]]){

    const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.11,1.75,7),postMat);shaft.position.y=1.02;shaft.castShadow=true;post.add(shaft);

function sanitizeDecorLayout(){
  const clearanceFor = (r,type) => type==='tree' ? r*3.5+90 : r+24;
  const blocked = (x,y,r,index,type) => {
    const clearance=clearanceFor(r,type);
    if (x < clearance+55 || x > 2400-clearance-55 || y < clearance+55 || y > 1600-clearance-55) return true;
    // Keep scenery clear of spawns, objectives, vaults and exits.
    if (Math.hypot(x-150,y-150) < clearance+95 || Math.hypot(x-2250,y-1450) < clearance+95) return true;
    for (const gen of generators) if (Math.hypot(x-gen.x,y-gen.y) < clearance+68) return true;
    if (!totem.broken && Math.hypot(x-totem.x,y-totem.y) < clearance+34) return true;
    for (const p of pallets) if (Math.hypot(x-p.x,y-p.y) < clearance+72) return true;
    for (const win of windows) if (circleRect(x,y,clearance+8,win.x-18,win.y-18,win.w+36,win.h+36)) return true;
    for (const e of exitDoors) if (circleRect(x,y,clearance+8,e.x,e.y,e.w,e.h)) return true;
    for (const w of walls) if (circleRect(x,y,clearance,w.x,w.y,w.w,w.h)) return true;

    // Check every other prop, not only earlier array entries. This prevents later
    // relocations from putting a tree back into a narrow route or another prop.
    for (let i=0;i<decor.length;i++){
      if(i===index || decor[i].hidden) continue;
      const other=decor[i],otherClearance=clearanceFor(other.r,other.type);
      if(Math.hypot(x-other.x,y-other.y)<clearance+otherClearance) return true;
    }
    return false;
  };

  // A wider deterministic search moves trees out of tight wall corridors.
  decor.forEach((d,index)=>{
    if(!blocked(d.x,d.y,d.r,index,d.type)) return;
    const ox=d.x,oy=d.y;
    let placed=false;
    for(let radius=50;radius<=600&&!placed;radius+=50){
      for(let step=0;step<24;step++){
        const angle=step*Math.PI/12;
        const x=Math.round((ox+Math.cos(angle)*radius)/10)*10;
        const y=Math.round((oy+Math.sin(angle)*radius)/10)*10;
        if(!blocked(x,y,d.r,index,d.type)){
          d.x=x;d.y=y;placed=true;break;
        }
      }
    }
    if(!placed){d.hidden=true;log('Декор скрыт: не найдено безопасное место '+d.type+' '+index);}
  });
}

function buildWorld(){
  sanitizeDecorLayout();
  const wallBoards=[
    new THREE.MeshStandardMaterial({color:0x77756d,roughness:0.94}),
    new THREE.MeshStandardMaterial({color:0x817e74,roughness:0.94}),
    new THREE.MeshStandardMaterial({color:0x6f706b,roughness:0.96})
  ];
  for (const w of walls){
    const m = new THREE.Mesh(new THREE.BoxGeometry(PX(w.w), 2.65, PX(w.h)), wallMat());
    m.position.set(PX(w.x + w.w/2), 1.325, PX(w.y + w.h/2));
    m.castShadow = true; m.receiveShadow = true; scene.add(m);
    const alongX=w.w>=w.h, length=PX(alongX?w.w:w.h), depth=PX(alongX?w.h:w.w), cx=PX(w.x+w.w/2), cz=PX(w.y+w.h/2);
    const trim=woodMat();
    for(const side of [-1,1]){
      const faceOffset=depth/2+0.035;
      // Horizontal siding makes each maze wall read as a built structure, not a flat slab.
      for(let row=0;row<5;row++){
        const board=new THREE.Mesh(
          new THREE.BoxGeometry(alongX?Math.max(0.2,length-0.16):0.075,0.31,alongX?0.075:Math.max(0.2,length-0.16)),
          wallBoards[(row+Math.round(w.x/20)+Math.round(w.y/20))%wallBoards.length]
        );
        const y=0.42+row*0.43;
        board.position.set(alongX?cx:cx+side*faceOffset,y,alongX?cz+side*faceOffset:cz);
        board.castShadow=true;board.receiveShadow=true;scene.add(board);
      }
      const rail=new THREE.Mesh(new THREE.BoxGeometry(alongX?length:0.13,0.13,alongX?0.13:length),trim);
      rail.position.set(cx,2.52,cz+(alongX?side*(depth/2+0.10):0));if(!alongX)rail.position.set(cx+side*(depth/2+0.10),2.52,cz);
      rail.castShadow=true;scene.add(rail);

const CW=40, CH=40;
const GRID_W=Math.ceil(2400/CW), GRID_H=Math.ceil(1600/CH);
let costMap = null;
function buildCostMap(){
  const grid = new Float32Array(GRID_W*GRID_H).fill(1);
  for(const w of walls){
    const gx0=Math.max(0,Math.floor(w.x/CW)),gy0=Math.max(0,Math.floor(w.y/CH));
    const gx1=Math.min(GRID_W-1,Math.floor((w.x+w.w-1)/CW)),gy1=Math.min(GRID_H-1,Math.floor((w.y+w.h-1)/CH));
    for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++) grid[gy*GRID_W+gx]=999;
  }
  for(const door of exitDoors){
    if(door.opened)continue;
    const gx0=Math.max(0,Math.floor(door.x/CW)),gy0=Math.max(0,Math.floor(door.y/CH));
    const gx1=Math.min(GRID_W-1,Math.floor((door.x+door.w-1)/CW)),gy1=Math.min(GRID_H-1,Math.floor((door.y+door.h-1)/CH));
    for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++)grid[gy*GRID_W+gx]=999;
  }
  for(const win of windows){
    const cost = win.blockedTimer > 0 ? 999 : 8;
    const gx0=Math.max(0,Math.floor(win.x/CW)),gy0=Math.max(0,Math.floor(win.y/CH));
    const gx1=Math.min(GRID_W-1,Math.floor((win.x+win.w-1)/CW)),gy1=Math.min(GRID_H-1,Math.floor((win.y+win.h-1)/CH));
    for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++)
      if(grid[gy*GRID_W+gx]<999) grid[gy*GRID_W+gx]=cost;
  }
  for(const p of pallets){
    if(p.state!=='dropped'&&p.state!=='breaking') continue;
    const minX=p.x-CFG.PALLET_LEN/2-5,maxX=p.x+CFG.PALLET_LEN/2+5;
    const minY=p.y-CFG.PALLET_THICK/2-5,maxY=p.y+CFG.PALLET_THICK/2+5;
    const gx0=Math.max(0,Math.floor(minX/CW)),gy0=Math.max(0,Math.floor(minY/CH));
    const gx1=Math.min(GRID_W-1,Math.floor(maxX/CW)),gy1=Math.min(GRID_H-1,Math.floor(maxY/CH));
    for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++)
      if(grid[gy*GRID_W+gx]<999) grid[gy*GRID_W+gx]=Math.max(grid[gy*GRID_W+gx],15);

}
function heuristic(x,y,ex,ey){ const dx=Math.abs(x-ex),dy=Math.abs(y-ey); return (dx+dy)+(Math.SQRT2-2)*Math.min(dx,dy); }
function nearestFreeCell(gx,gy){

  for(let r=1;r<30;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
    if(Math.abs(dx)!==r&&Math.abs(dy)!==r) continue;

    if(nx>=0&&nx<GRID_W&&ny>=0&&ny<GRID_H&&costMap[ny*GRID_W+nx]<999) return {gx:nx,gy:ny};
  }

}
function findPath(from,to){
  if(!costMap) costMap=buildCostMap();
  let sx=Math.floor(from.x/CW),sy=Math.floor(from.y/CH);
  let ex=Math.floor(to.x/CW),ey=Math.floor(to.y/CH);
  sx=Math.max(0,Math.min(GRID_W-1,sx)); sy=Math.max(0,Math.min(GRID_H-1,sy));
  ex=Math.max(0,Math.min(GRID_W-1,ex)); ey=Math.max(0,Math.min(GRID_H-1,ey));
  if(costMap[sy*GRID_W+sx]>=999){const n=nearestFreeCell(sx,sy);sx=n.gx;sy=n.gy;}
  if(costMap[ey*GRID_W+ex]>=999){const n=nearestFreeCell(ex,ey);ex=n.gx;ey=n.gy;}
  const open=new Map(),closed=new Set();
  open.set(sy*GRID_W+sx,{x:sx,y:sy,g:0,f:heuristic(sx,sy,ex,ey),parent:null});

    open.delete(curKey);

    }

      const nx=cur.x+dx,ny=cur.y+dy;

}

function pickKillerAbility(){
  const pool = Object.keys(KILLER_ABILITIES);
  killerAbilityKey = pool[Math.floor(Math.random() * pool.length)];
  for (const k of ['dash','rage','breaker','swift','fast','paranoia','relentless','instinct','slowgaze','hunter','stalker','trap','chainsaw','hatchet','blink','invisible']){
    killer['has' + k.charAt(0).toUpperCase() + k.slice(1)] = (killerAbilityKey === k);
  }
}
function killerLOSClear(){
  if (!lineOfSightFree(killer.x, killer.y, survivor.x, survivor.y)) return false;
  for (const c of smokeClouds){
    if (Math.hypot(killer.x - c.x, killer.y - c.y) < c.r) return false;
    if (Math.hypot(survivor.x - c.x, survivor.y - c.y) < c.r) return false;
  }
  return true;
}
function computeKillerSpeed(){
  let s = CFG.KILLER_SPEED;
  if(killer.slowTimer>0)s*=0.62;
  if(killer.blindTimer>0)s*=0.82;
  if (killer.hasFast) s *= 1.15;
  if (killer.hasParanoia && Math.hypot(survivor.x-killer.x, survivor.y-killer.y) < 200) s *= 1.3;
  if (killer.hasInstinct && !lineOfSightFree(killer.x, killer.y, survivor.x, survivor.y)) s *= 1.15;
  if (killer.hasStalker) s *= 1.2;
  if (killer.rageTimer > 0) s *= 1.6;
  if (killer.invisibleTimer > 0) s *= CFG.INVISIBLE_SLOW;
  s *= (1 + killer.bloodlust * 0.05);

}
function tryKillerTrap(){ if(!killer.hasTrap||killer.trapCooldown>0||killer.abilityDisabledTimer>0) return; traps.push({x:killer.x,y:killer.y,active:true}); killer.trapCooldown=20; }
function tryKillerChainsaw(){ if(!killer.hasChainsaw||killer.chainsawCooldown>0||killer.abilityDisabledTimer>0) return; if(killer.state!=='idle') return; killer.state='chainsaw_charge'; killer.chainsawChargeTimer=0.5; killer.chainsawCooldown=12; }
function tryKillerHatchet(){
  if(!killer.hasHatchet||killer.hatchetCooldown>0||killer.abilityDisabledTimer>0) return;
  if(killer.state!=='idle') return;
  const dx=survivor.x-killer.x,dy=survivor.y-killer.y,d=Math.hypot(dx,dy);
  if(d>500) return;
  if(!lineOfSightFree(killer.x,killer.y,survivor.x,survivor.y)) return;
  killer.facing=Math.atan2(dy,dx);
  hatchets.push({x:killer.x,y:killer.y,vx:Math.cos(killer.facing)*CFG.HATCHET_SPEED,vy:Math.sin(killer.facing)*CFG.HATCHET_SPEED,life:CFG.HATCHET_LIFE});
  killer.hatchetCooldown=10;
}
function tryKillerBlink(){
  if(!killer.hasBlink||killer.blinkCooldown>0||killer.abilityDisabledTimer>0) return;
  if(killer.state!=='idle') return;
  let tx=killer.x+Math.cos(killer.facing)*CFG.BLINK_DISTANCE,ty=killer.y+Math.sin(killer.facing)*CFG.BLINK_DISTANCE;
  tx=Math.max(30,Math.min(2370,tx)); ty=Math.max(30,Math.min(1570,ty));
  killer.x=tx; killer.y=ty; killer.blinkCooldown=CFG.BLINK_COOLDOWN; killer.path=null;
}
function tryKillerInvisible(){

  killer.invisibleTimer=CFG.INVISIBLE_TIME; killer.invisibleCooldown=CFG.INVISIBLE_COOLDOWN;
}

function killerUseAbility(){
  if (killer.abilityDisabledTimer > 0) return;
  if (killer.state !== 'idle') return;
  if (killer.hasDash) { killer.state = 'dash_windup'; killer.dashWindupTimer = 0; killer.dashDirX = Math.cos(killer.facing); killer.dashDirY = Math.sin(killer.facing); }
  else if (killer.hasChainsaw) tryKillerChainsaw();
  else if (killer.hasHatchet) tryKillerHatchet();
  else if (killer.hasBlink) tryKillerBlink();
  else if (killer.hasInvisible) tryKillerInvisible();
  else if (killer.hasTrap) tryKillerTrap();
}

function tryHitSurvivor(ignoreAttackCooldown=false){
  const k = killer;
  if (!ignoreAttackCooldown && k.attackCooldown > 0) return false;
  const distS = Math.hypot(survivor.x-k.x, survivor.y-k.y);
  if (distS >= CFG.ATTACK_RANGE || survivor.state === 'vaulting' || survivor.state === 'healing') return false;
  if (survivor.invulnerableTimer > 0 || survivor.hitCooldown > 0) return false;
  k.attackRecoveryTimer=Math.max(k.attackRecoveryTimer,1.05);
  k.attackHitPending=false;k.attackHitTimer=0;
  k.attackCooldown = Math.max(k.attackCooldown,CFG.KILLER_ATTACK_COOLDOWN);
  killer.bloodlust = 0; killer.lastHitTime = game.time;survivor.animEvent='hit';survivor.animTimer=0.72;
  if (selectedSurvivor === 'tank' && survivor.health === 'injured' && !survivor.hitOnce) {
    survivor.hitOnce = true; survivor.invulnerableTimer = 3; survivor.speedBoostTimer = 2;
    survivor.invisibleTimer = 2; survivor.hitCooldown = CFG.HIT_COOLDOWN;
    const dx = survivor.x - k.x, dy = survivor.y - k.y, d = Math.hypot(dx, dy);
    if (d > 0) { survivor.x += (dx/d)*120; survivor.y += (dy/d)*120; }
    killer.path = null; screenShake = 12;
    game.hint = 'Танк выжил!'; game.hintTime = 2.5; return true;
  }
  if (survivor.health === 'healthy') {
    survivor.health = 'injured'; survivor.animEvent='hit';survivor.animTimer=0.72; survivor.hitCooldown = CFG.HIT_COOLDOWN;
    survivor.speedBoostTimer = 1.5; survivor.invisibleTimer = 1;
    const dx = survivor.x - k.x, dy = survivor.y - k.y, d = Math.hypot(dx, dy);
    if (d > 0) { survivor.x += (dx/d)*80; survivor.y += (dy/d)*80; }
    killer.path = null; killer.chaseCommitTimer = CFG.INJURED_CHASE_COMMIT;
    screenShake = 10; game.hint = 'РАНЕН!'; game.hintTime = 2.5; return true;
  }
  game.screen = 'lose'; screenShake = 20;
  if (MP.role === 'host' && MP.connReady) MP.conn.send({type:'end', screen:'lose'});
  showEndScreen('ПОЙМАН', 'Выживший пойман', '#ff5050');
  return true;
}

function updateKillerAI(dt){
  const k = killer;
  if (k.dashCooldown>0) k.dashCooldown-=dt;
  if (k.rageTimer>0) k.rageTimer-=dt;
  if (k.trapCooldown>0) k.trapCooldown-=dt;
  if (k.chainsawCooldown>0) k.chainsawCooldown-=dt;
  if (k.hatchetCooldown>0) k.hatchetCooldown-=dt;
  if (k.blinkCooldown>0) k.blinkCooldown-=dt;
  if (k.invisibleCooldown>0) k.invisibleCooldown-=dt;
  if (k.abilityDisabledTimer>0) k.abilityDisabledTimer-=dt;
  if (k.invisibleTimer>0) k.invisibleTimer-=dt;
  if (k.instinctActive>0) k.instinctActive-=dt;
  if (k.cautiousTimer>0) k.cautiousTimer-=dt;
  if (k.chaseCommitTimer>0) k.chaseCommitTimer-=dt;
  if (k.attackCooldown>0) k.attackCooldown-=dt;

  const losClear = killerLOSClear() && !survivor.invisibleTimer && k.blindTimer<=0;
  const distToS = Math.hypot(survivor.x - k.x, survivor.y - k.y);
  const timeSinceSeen = k.lastSeen ? game.time - k.lastSeenTime : 999;
  if (losClear && survivor.state !== 'vaulting') {
    k.lastSeen = {x: survivor.x, y: survivor.y}; k.lastSeenTime = game.time;
  }
  k.instinctTimer -= dt;
  if (k.instinctTimer <= 0) {
    k.instinctTimer = CFG.KILLER_INSTINCT_INTERVAL;
    if (!(selectedSurvivor === 'ironwill' && survivor.health === 'injured') && losClear) k.instinctActive = CFG.KILLER_INSTINCT_DURATION;
  }
  if (k.state === 'stunned' || k.state === 'blinded') { k.stunTimer -= dt; if (k.stunTimer<=0) k.state='idle'; return; }
  if (k.state === 'chainsaw_charge') {
    k.chainsawChargeTimer -= dt;
    if (k.chainsawChargeTimer <= 0) { k.state='chainsaw_dash'; k.chainsawDashTimer=0.6; k.chainsawDirX=Math.cos(k.facing); k.chainsawDirY=Math.sin(k.facing); }
    return;
  }
  if (k.state === 'chainsaw_dash') {
    k.chainsawDashTimer -= dt;
    const step=900*dt, ox=k.x, oy=k.y;
    k.x+=k.chainsawDirX*step; k.y+=k.chainsawDirY*step;
    let blocked=false;
    if(collideKiller(k)) blocked=true;
    if (blocked||Math.hypot(k.x-ox,k.y-oy)<step*0.3||k.chainsawDashTimer<=0){k.state='idle';return;}
    if (tryHitSurvivor()) return; return;
  }
  if (k.state === 'breaking') {
    k.breakTimer += dt;
    const bTime = killer.hasBreaker ? CFG.PALLET_BREAK_TIME*0.5 : CFG.PALLET_BREAK_TIME;
    if (k.breakTarget) {

      if (dot>0.95) tryKillerHatchet();
    }
    if (killer.hasChainsaw&&k.chainsawCooldown<=0&&distToS>300&&distToS<600&&losClear) tryKillerChainsaw();
    if (killer.hasBlink&&k.blinkCooldown<=0&&distToS>250&&distToS<400&&losClear&&!survivor.invisibleTimer) tryKillerBlink();
    if (killer.hasInvisible&&k.invisibleCooldown<=0&&!losClear&&distToS<500&&k.invisibleTimer<=0) tryKillerInvisible();
  }
  if (distToS < 350 && losClear && k.state==='idle' && survivor.state!=='vaulting') {

    const ddx=tx-k.x,ddy=ty-k.y,dd=Math.hypot(ddx,ddy);
    if (dd>1){

      const speed=computeKillerSpeed(),step=speed*dt;
      k.x+=nx*step; k.y+=ny*step;
      collideKiller(k);
      if (tryHitSurvivor()) return; return;
    }
  }
  let tx,ty;
  const hearing=(Math.hypot(survivor.vx,survivor.vy)>150) && (survivor.invisibleTimer<=0);
  const hearingRange=hearing?CFG.HEARING_RANGE_RUNNING:CFG.HEARING_RANGE_CROUCH;
  if (losClear && survivor.state!=='vaulting'){tx=survivor.x;ty=survivor.y;}
  else {
    const newest=bloodTrail.length>0?bloodTrail[bloodTrail.length-1]:null;

    if (newest&&age<CFG.BLOOD_TRAIL_LIFETIME){tx=newest.x;ty=newest.y;k.lastSeen={x:tx,y:ty};k.lastSeenTime=game.time;}
    else if (k.lastSeen&&timeSinceSeen<CFG.LAST_SEEN_TIMEOUT){tx=k.lastSeen.x;ty=k.lastSeen.y;}
    else if (hearing&&distToS<hearingRange){tx=survivor.x+(Math.random()-0.5)*120;ty=survivor.y+(Math.random()-0.5)*120;tx=Math.max(30,Math.min(2370,tx));ty=Math.max(30,Math.min(1570,ty));}
    else {
      let bestGen=null,bestScore=-Infinity;
      for(const gen of generators){if(gen.done)continue;const gD=Math.hypot(gen.x-k.x,gen.y-k.y);const sc=gen.progress*500+(1000-gD)*0.3;if(sc>bestScore){bestScore=sc;bestGen=gen;}}
      if (bestGen&&Math.random()<0.7){tx=bestGen.x;ty=bestGen.y;}
      else {if(!k.searchTarget||Math.hypot(k.x-k.searchTarget.x,k.y-k.searchTarget.y)<60){const cand=PATROL_POINTS.filter(p=>!k.searchTarget||(p.x!==k.searchTarget.x||p.y!==k.searchTarget.y));k.searchTarget=cand[Math.floor(Math.random()*cand.length)];}tx=k.searchTarget.x;ty=k.searchTarget.y;}
    }

  }
  if (k.path&&k.path.length>0){
    const target=k.path[0];
    const dx=target.x-k.x,dy=target.y-k.y,d=Math.hypot(dx,dy);
    if (d<25) k.path.shift();
    else {
      const nx=dx/d,ny=dy/d;
      k.facing=Math.atan2(ny,nx); k.walkPhase+=dt*12;
      const speed=computeKillerSpeed(),step=speed*dt;
      const ox=k.x,oy=k.y;
      k.x+=nx*step; k.y+=ny*step;

        k.x=ox; k.y=oy; k.stuckTimer+=dt;
        let handled=false;
        for(const p of pallets){
          if(p.state!=='dropped') continue;
          const pd=Math.hypot(p.x-k.x,p.y-k.y);
          if(pd<CFG.BREAK_RANGE+15){
            const toX=p.x-k.x,toY=p.y-k.y;
            if((nx*toX+ny*toY)/pd>0.4){k.state='breaking';k.breakTarget=p;k.breakTimer=0;p.state='breaking';p.breakTimer=0;costMap=null;handled=true;break;}
          }
        }
        if (handled) return;
        if (k.stuckTimer>1.5){k.stuckTimer=0;k.path=null;k.pathTimer=0;k.facing+=Math.PI/2;}
      } else k.stuckTimer=0;
    }
  }
  tryHitSurvivor();
}

function updateKillerPlayer(dt, input){
  const k = killer;
  if (k.dashCooldown>0) k.dashCooldown-=dt;
  if (k.rageTimer>0) k.rageTimer-=dt;
  if (k.trapCooldown>0) k.trapCooldown-=dt;

  if (k.cautiousTimer>0) k.cautiousTimer-=dt;

    if(collideKiller(k)) blocked=true;

    tryHitSurvivor();
    return;
  }
  if (k.state === 'dash_windup') {
    k.dashWindupTimer += dt;
    if (k.dashWindupTimer >= CFG.DASH_WINDUP) {
      k.state = 'dashing'; k.dashTimer = 0;
      k.dashDirX = Math.cos(k.facing); k.dashDirY = Math.sin(k.facing);
    }
    return;
  }
  if (k.state === 'dashing') {
    k.dashTimer += dt;
    const step = CFG.KILLER_DASH_SPEED * dt, ox = k.x, oy = k.y;
    k.x += k.dashDirX * step; k.y += k.dashDirY * step;
    let blocked = false;
    if(collideKiller(k)) blocked=true;
    if (blocked || Math.hypot(k.x-ox,k.y-oy) < step*0.3 || k.dashTimer >= CFG.DASH_DURATION) { k.state='idle'; k.dashCooldown=CFG.DASH_COOLDOWN; return; }
    tryHitSurvivor();
    return;
  }
  if (k.state === 'breaking') {
    k.breakTimer += dt;
    const bTime = killer.hasBreaker ? CFG.PALLET_BREAK_TIME*0.5 : CFG.PALLET_BREAK_TIME;
    if (k.breakTarget) {
      k.facing = Math.atan2(k.breakTarget.y-k.y, k.breakTarget.x-k.x);
      k.breakTarget.breakTimer = k.breakTimer;
      if (k.breakTimer >= bTime) {
        k.breakTarget.state = 'broken'; screenShake = 6;
        k.state = 'idle'; k.breakTarget = null; k.breakTimer = 0;
        costMap = null;
        if (killer.hasButcher) killer.butcherTimer = 3;
      }
    } else k.state = 'idle';
    return;
  }
  if (k.state === 'vaulting') {
    k.vaultTimer += dt;
    if (k.vaultTimer >= k.vaultDuration) { k.x=k.vaultTo.x; k.y=k.vaultTo.y; k.state='idle'; }
    else {
      const t = k.vaultTimer/k.vaultDuration, e = t*t*(3-2*t);
      k.x = k.vaultFrom.x + (k.vaultTo.x-k.vaultFrom.x)*e;
      k.y = k.vaultFrom.y + (k.vaultTo.y-k.vaultFrom.y)*e;
    }
    return;
  }
  if (k.state !== 'idle') return;
  if(k.attackLungeTimer>0){
    const step=CFG.ATTACK_LUNGE_SPEED*dt;
    k.x+=k.attackLungeDirX*step;k.y+=k.attackLungeDirY*step;
    collideKiller(k);
    // Check the hit window during the lunge, not only at its final position.
    tryHitSurvivor(true);
    k.x=Math.max(k.radius+20,Math.min(2380-k.radius,k.x));k.y=Math.max(k.radius+20,Math.min(1580-k.radius,k.y));
    k.attackLungeTimer=Math.max(0,k.attackLungeTimer-dt);
    if(k.attackLungeTimer<=0){if(!k.attackHitPending)tryHitSurvivor(true);k.attackRecoveryTimer=Math.max(k.attackRecoveryTimer,0.55);k.attackChargeTimer=0;}
    return;
  }
  const fX = Math.cos(k.facing), fY = Math.sin(k.facing);
  const rX = Math.cos(k.facing + Math.PI/2), rY = Math.sin(k.facing + Math.PI/2);
  let mx=0, my=0;
  if (input.w) { mx += fX; my += fY; }
  if (input.s) { mx -= fX; my -= fY; }
  if (input.a) { mx -= rX; my -= rY; }
  if (input.d) { mx += rX; my += rY; }
  const len = Math.hypot(mx, my);
  if (k.attackRecoveryTimer>0) { mx=0; my=0; }
  if (len > 0) {
    mx /= len; my /= len;
    k.walkPhase += dt * 12;
    const speed = computeKillerSpeed(), step = speed * dt;
    const ox = k.x, oy = k.y;
    k.x += mx*step; k.y += my*step;
    collideKiller(k);
    k.x = Math.max(k.radius+20, Math.min(2380-k.radius, k.x));
    k.y = Math.max(k.radius+20, Math.min(1580-k.radius, k.y));
    if (Math.hypot(k.x-ox,k.y-oy) < step*0.3) {
      for (const win of windows) {
        if (win.blockedTimer > 0) continue;
        if (Math.hypot(win.cx-k.x, win.cy-k.y) < CFG.WINDOW_INTERACT) {
          const toX = win.cx-k.x, toY = win.cy-k.y, d2 = Math.hypot(toX, toY);
          if ((mx*toX + my*toY)/d2 > 0.3) { startVault(k, win.cx, win.cy, 'window', win); return; }
        }
      }
      for (const p of pallets) {
        if (p.state !== 'dropped') continue;
        if (Math.hypot(p.x-k.x, p.y-k.y) < CFG.BREAK_RANGE + 15) {
          const toX = p.x-k.x, toY = p.y-k.y, d2 = Math.hypot(toX, toY);
          if ((mx*toX + my*toY)/d2 > 0.3) {
            k.state = 'breaking'; k.breakTarget = p; k.breakTimer = 0;
            p.state = 'breaking'; p.breakTimer = 0; costMap = null;
            return;
          }
        }
      }
    }
  }

  const attackNow=!!input.attack;
  if(attackNow&&!k.attackHeldPrev){k.attackChargeTimer=0;k.attackLungeTriggered=false;}
  if(attackNow&&k.attackCooldown<=0&&k.attackRecoveryTimer<=0){
    k.attackChargeTimer+=dt;
    if(k.attackChargeTimer>=CFG.ATTACK_CHARGE_TIME&&k.attackLungeTimer<=0){
      k.attackLungeTimer=CFG.ATTACK_LUNGE_TIME;k.attackLungeDirX=Math.cos(k.facing);k.attackLungeDirY=Math.sin(k.facing);
      k.attackAnimTimer=0.5;k.attackAnimType='lunge';k.animEvent='attack';k.animTimer=0.5;k.attackLungeTriggered=true;
      k.attackCooldown=CFG.KILLER_ATTACK_COOLDOWN;k.attackRecoveryTimer=0.28;k.attackHitPending=false;
    }
  }
  if(!attackNow&&k.attackHeldPrev&&!k.attackLungeTriggered&&k.attackCooldown<=0&&k.attackRecoveryTimer<=0&&k.attackLungeTimer<=0){
    k.attackAnimTimer=0.52;k.attackAnimType='swing';k.animEvent='attack';k.animTimer=0.52;
    k.attackCooldown=CFG.KILLER_ATTACK_COOLDOWN;k.attackRecoveryTimer=0.22;
    k.attackHitPending=true;k.attackHitTimer=0.22;k.attackLungeTriggered=false;
  }
  if(!attackNow)k.attackLungeTriggered=false;
  k.attackHeldPrev=attackNow;
  if(!attackNow&&k.attackLungeTimer<=0)k.attackChargeTimer=0;
// Ability activation is edge-triggered by the main loop; do not trigger it again here.
}

  s.x=Math.max(s.radius+20,Math.min(2380-s.radius,s.x));

function collideSurvivor(s){
  for(const w of walls) if(circleRect(s.x,s.y,s.radius,w.x,w.y,w.w,w.h)) resolveCircleRect(s,w);
  for(const win of windows) if(circleRect(s.x,s.y,s.radius,win.x,win.y,win.w,win.h)) resolveCircleRect(s,win);
  for(const p of pallets){
    if((p.state==='dropped'||p.state==='breaking')&&circleRotRect(s.x,s.y,s.radius,p.x,p.y,CFG.PALLET_LEN,CFG.PALLET_THICK,p.angle))
      resolveCircleRotRect(s,p.x,p.y,CFG.PALLET_LEN,CFG.PALLET_THICK,p.angle);
  }
  for(const door of exitDoors) if(!door.opened&&circleRect(s.x,s.y,s.radius,door.x,door.y,door.w,door.h)) resolveCircleRect(s,door);
}

    const step = speed * dt;
    s.isMoving=true;s.walkPhase += dt * 12;
    s.x += moveX * step; collideSurvivor(s);
    s.y += moveY * step; collideSurvivor(s);
    s.x = Math.max(s.radius+20, Math.min(2380-s.radius, s.x));
    s.y = Math.max(s.radius+20, Math.min(1580-s.radius, s.y));
    return;
  }

  if (s.health === 'injured' && s.state !== 'healing') {
    s.state = 'healing'; s.healTimer = CFG.HEAL_TIME;
    return;
  }

  let target = null, minD = Infinity;
  for (const g of generators) {
    if (g.done) continue;
    const d = Math.hypot(g.x - s.x, g.y - s.y);
    if (d < minD) { minD = d; target = g; }
  }
  if (!target) {
    for (const e of exitDoors) {
      const d = Math.hypot(e.x + e.w/2 - s.x, e.y + e.h/2 - s.y);
      if (d < minD) { minD = d; target = { x: e.x + e.w/2, y: e.y + e.h/2, _exit: e }; }
    }
  }
  if (!target) return;

  const dx = target.x - s.x, dy = target.y - s.y, d = Math.hypot(dx, dy);
  if (d < 65) {
    s.facing = Math.atan2(dy, dx);
    survivor.repairing = target._exit ? { type: 'exit', ref: target._exit } : { type: 'gen', ref: target };
    let progressKey = target._exit ? 'openProgress' : 'progress';
    let rate = target._exit ? 1/CFG.EXIT_OPEN_TIME : (1/CFG.GENERATOR_REPAIR_TIME);
    target[progressKey] += rate / 60;
    if (target[progressKey] >= 1) {
      if (target._exit) target._exit.opened = true;
      else target.done = true;
    }
  } else {
    s.facing = Math.atan2(dy, dx);
    const moveX = Math.cos(s.facing), moveY = Math.sin(s.facing);
    let speed = CFG.SURVIVOR_SPEED;
    if (s.health === 'injured') speed *= CFG.INJURED_SPEED_MULT;
    const step = speed * dt;
    s.isMoving=true;s.walkPhase += dt * 12;
    s.x += moveX * step; collideSurvivor(s);
    s.y += moveY * step; collideSurvivor(s);
  }
  s.x = Math.max(s.radius+20, Math.min(2380-s.radius, s.x));
  s.y = Math.max(s.radius+20, Math.min(1580-s.radius, s.y));
}

function updatePallets(dt){

    if (p.state==='falling'){
      p.fallTimer+=dt;
      const t=Math.min(1,p.fallTimer/CFG.PALLET_FALL_TIME),e=1-Math.pow(1-t,3);
      p.visualAngle=p.fallDir*(Math.PI/2.1)*e;

}
function updateWindows(dt){

}
function updateSmoke(dt){ for(let i=smokeClouds.length-1;i>=0;i--){smokeClouds[i].timer-=dt;if(smokeClouds[i].timer<=0)smokeClouds.splice(i,1);} }
function updateTraps(dt){

    if (Math.hypot(survivor.x-t.x,survivor.y-t.y)<CFG.TRAP_RADIUS){
      survivor.slowTimer=CFG.TRAP_STUN; survivor.hitCooldown=CFG.TRAP_STUN;

}
function updateHatchets(dt){

      else {game.screen='lose';if (MP.role==='host'&&MP.connReady)MP.conn.send({type:'end',screen:'lose'});showEndScreen('ПОЙМАН','Топор убийцы настиг','#ff5050');}
      hit=true;
    }
    for(const w of walls) if(h.x>w.x&&h.x<w.x+w.w&&h.y>w.y&&h.y<w.y+w.h) hit=true;
    if (hit||h.life<=0||h.x<0||h.x>2400||h.y<0||h.y>1600) hatchets.splice(i,1);

function updateBloodTrail(dt){
  const moving = survivor.health==='injured' && survivor.isMoving && survivor.state === 'idle';
  survivor.trailTimer=(survivor.trailTimer||0)+dt;
  if (moving&&survivor.noTrailTimer<=0&&survivor.invisibleTimer<=0&&survivor.trailTimer>CFG.BLOOD_TRAIL_INTERVAL){

  }
  for(let i=bloodTrail.length-1;i>=0;i--) if(game.time-bloodTrail[i].time>CFG.BLOOD_TRAIL_LIFETIME) bloodTrail.splice(i,1);
}
function checkWin(){
  const s=survivor;

function tryInteractHold(input, dt=1/60){
  dt=Math.max(0,Math.min(0.05,Number(dt)||0));
  const s=survivor;
  if (s.state==='vaulting'||s.state==='healing') return false;
  let near=null;
  for(const gen of generators){if(gen.done)continue;if(Math.hypot(gen.x-s.x,gen.y-s.y)<CFG.GENERATOR_INTERACT&&lineOfSightFree(s.x,s.y,gen.x,gen.y)){near={type:'gen',ref:gen};break;}}
  if (!near&&!totem.broken&&Math.hypot(totem.x-s.x,totem.y-s.y)<CFG.TOTEM_INTERACT&&lineOfSightFree(s.x,s.y,totem.x,totem.y)) near={type:'totem',ref:totem};
  if (!near) for(const e of exitDoors){if(e.opened)continue;const ex=e.x+e.w/2,ey=e.y+e.h/2;if(Math.hypot(ex-s.x,ey-s.y)<CFG.EXIT_INTERACT&&generators.every(g=>g.done)&&lineOfSightFree(s.x,s.y,ex,ey)){near={type:'exit',ref:e};break;}}
  if (!near){s.repairing=null;s.repairTimer=0;return false;}
  s.repairing=near;
  if (near.type==='gen'){
    let boost=1; if(selectedItem==='toolbox'&&!survivor.itemUsed) boost=1.35;
    near.ref.progress=Math.min(1,near.ref.progress+(dt/CFG.GENERATOR_REPAIR_TIME)*boost);
    if (near.ref.progress>=1){
      near.ref.progress=1; near.ref.done=true; screenShake=4;
      if(selectedItem==='toolbox'&&!survivor.itemUsed){
        survivor.itemUsed=true;
        game.hint='Генератор готов! Набор инструментов израсходован.';
      }else game.hint='Генератор готов!';
      game.hintTime=2;
    }
    return true;
  } else if (near.type==='totem'){
    near.ref.progress+=dt/CFG.TOTEM_BREAK_TIME;
    if (near.ref.progress>=1){near.ref.broken=true;killer.abilityDisabledTimer=CFG.TOTEM_DISABLE_TIME;screenShake=8;game.hint='Тотем сломан!';game.hintTime=3;}
    return true;
  } else if (near.type==='exit'){
    near.ref.openProgress+=dt/CFG.EXIT_OPEN_TIME;

}
function tryInteractSingle(){
  const s=survivor;
  if (s.state==='vaulting'||s.state==='healing'||s.vaultCooldown>0) return;
  let best=null,bestDist=Infinity,bestType=null;
  for(const p of pallets){const d=Math.hypot(p.x-s.x,p.y-s.y);if(d<CFG.PALLET_INTERACT&&(p.state==='upright'||p.state==='dropped')&&d<bestDist){bestDist=d;best=p;bestType='pallet';}}
  for(const win of windows){if(win.blockedTimer>0)continue;const d=Math.hypot(win.cx-s.x,win.cy-s.y);if(d<CFG.WINDOW_INTERACT&&d<bestDist){bestDist=d;best=win;bestType='window';}}
  if (!best) return;
  if (bestType==='pallet'){
    if (best.state==='upright') dropPallet(best);
    else if (best.state==='dropped'){
      const px=Math.cos(best.angle+Math.PI/2),py=Math.sin(best.angle+Math.PI/2);
      const sS=(s.x-best.x)*px+(s.y-best.y)*py;
      if (Math.abs(sS)>8&&Math.abs(sS)<70) startVault(s,best.x,best.y,'pallet',best);
    }
  } else if (bestType==='window') startVault(s,best.cx,best.cy,'window',best);
}
function dropPallet(p){
  if (p.state!=='upright') return;
  p.state='falling'; p.fallTimer=0;survivor.animEvent='pallet_drop';survivor.animTimer=0.55;
  const s=survivor,k=killer;
  const px=Math.cos(p.angle+Math.PI/2),py=Math.sin(p.angle+Math.PI/2);
  const sS=(s.x-p.x)*px+(s.y-p.y)*py;
  const kS=(k.x-p.x)*px+(k.y-p.y)*py;
  p.fallDir = Math.abs(sS)<6 ? (kS>0?-1:1) : (sS>0?-1:1);
  const kParallel=(k.x-p.x)*Math.cos(p.angle)+(k.y-p.y)*Math.sin(p.angle);
  const withinPallet=Math.abs(kParallel)<CFG.PALLET_LEN/2+40;
  const onFallSide=Math.sign(kS)===p.fallDir;
  const closePerp=Math.abs(kS)<CFG.STUN_RANGE;
  const kDist=Math.hypot(k.x-p.x,k.y-p.y);
  if (kDist<CFG.STUN_RANGE+20&&withinPallet&&(onFallSide||Math.abs(kS)<22)&&closePerp){
    if (k.state!=='stunned'&&k.state!=='blinded'&&k.state!=='breaking') stunKiller();
  }
}
function stunKiller(){
  let stunDur=CFG.STUN_TIME; if(killer.hasRelentless) stunDur*=0.5;
  killer.state='stunned'; killer.stunTimer=stunDur; killer.path=null;killer.animEvent='stun';killer.animTimer=stunDur;killer.attackLungeTimer=0;killer.attackLungeTriggered=false;killer.attackChargeTimer=0;killer.attackAnimTimer=0;killer.attackHitPending=false;killer.attackHitTimer=0;killer.attackRecoveryTimer=0;killer.attackHeldPrev=false;
  if (killer.hasRage) killer.rageTimer=4;
  screenShake=14; game.hint='Оглушён!'; game.hintTime=2;
}
function startVault(entity,targetX,targetY,type,obj){
  if (type==='window'&&obj.blockedTimer>0) return;
  let fromX=entity.x,fromY=entity.y;
  let toX,toY;
  if (type==='pallet'){
    const px=Math.cos(obj.angle+Math.PI/2),py=Math.sin(obj.angle+Math.PI/2);
    const sS=(fromX-obj.x)*px+(fromY-obj.y)*py;
    const sign=sS>0?1:-1;
    toX=obj.x-px*sign*CFG.VAULT_DISTANCE; toY=obj.y-py*sign*CFG.VAULT_DISTANCE;
  } else {
    const win=obj; const sideSign=fromX>win.cx?1:-1;
    toX=win.cx-sideSign*(win.w/2+CFG.VAULT_DISTANCE); toY=fromY;
  }
  const stepX=Math.sign(toX-fromX)*4,stepY=Math.sign(toY-fromY)*4;
  for(let iter=0;iter<25;iter++){
    let collides=false;
    for(const w of walls) if(circleRect(toX,toY,entity.radius,w.x,w.y,w.w,w.h)){collides=true;break;}
    if(!collides) break;
    toX+=stepX; toY+=stepY;
  }
  let dur=entity===killer?CFG.VAULT_TIME_KILLER:CFG.VAULT_TIME_SURVIVOR;
  if (entity===killer&&killer.hasSwift) dur/=2;
  if (entity===survivor&&selectedSurvivor==='vaultmaster') dur/=1.7;
  entity.state='vaulting'; entity.vaultTimer=0; entity.vaultDuration=dur;entity.animEvent='vault';entity.animTimer=dur;
  entity.vaultFrom={x:fromX,y:fromY}; entity.vaultTo={x:toX,y:toY};
  entity.facing=Math.atan2(toY-fromY,toX-fromX);
  if (type==='window'&&entity===survivor){
    onWindowVault(obj);
    if (selectedSurvivor==='lithe') survivor.litheTimer=3;
    if (selectedSurvivor==='dwh') survivor.noTrailTimer=4;
  }
}
function onWindowVault(win){
  win.vaultTimestamps.push(game.time);
  if (win.vaultTimestamps.length>=CFG.WINDOW_BLOCK_AFTER&&win.blockedTimer<=0){
    win.blockedTimer=CFG.WINDOW_BLOCK_TIME; win.vaultTimestamps=[]; costMap=null;
    screenShake=8; game.hint='Окно заблокировано!'; game.hintTime=2.5;
  }
}
function tryAbility(){
  const ab=SURVIVOR_ABILITIES[selectedSurvivor];

  survivor.abilityCooldown=ab.cooldown;
  if (selectedSurvivor==='sprinter'){survivor.speedBoostTimer=ab.duration;game.hint='Рывок!';game.hintTime=1.5;}
  else if (selectedSurvivor==='shadow'){survivor.invisibleTimer=ab.duration;survivor.lastKnownPos={x:survivor.x,y:survivor.y};game.hint='Растворяешься...';game.hintTime=2;}
  else if (selectedSurvivor==='endurer'){survivor.invulnerableTimer=ab.duration;game.hint='Неуязвим!';game.hintTime=2;}
  else if (selectedSurvivor==='saboteur'){
    let count=0;
    for(const p of pallets) if(Math.hypot(p.x-survivor.x,p.y-survivor.y)<250&&p.state==='upright'){
      p.state='falling'; p.fallTimer=0;
      p.fallDir=((killer.x-p.x)*Math.cos(p.angle+Math.PI/2)+(killer.y-p.y)*Math.sin(p.angle+Math.PI/2))>0?-1:1;
      count++;
    }
    if (count>0){costMap=null;screenShake=6;game.hint=`Сброшено: ${count}`;game.hintTime=2;}
  }
  else if (selectedSurvivor==='doctor'){
    const d=Math.hypot(killer.x-survivor.x,killer.y-survivor.y);

    else {game.hint='Далеко';game.hintTime=1.5;}

function updateFlashlight(dt,held){
  const light=camera3d&&camera3d.userData.flashlightLight;
  const beam=camera3d&&camera3d.userData.flashlightBeam;
  const stop=()=>{survivor.flashlightActive=false;if(light)light.intensity=0;if(beam)beam.visible=false;};
  if(selectedItem!=='flashlight'||!held||survivor.itemCooldown>0||survivor.state!=='idle'||survivor.repairing){survivor.flashlightCharge=0;stop();return;}
  const dx=killer.x-survivor.x,dy=killer.y-survivor.y,dist=Math.hypot(dx,dy),angle=Math.atan2(dy,dx);
  let da=angle-survivor.facing;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
  const face=Math.atan2(survivor.y-killer.y,survivor.x-killer.x);let fd=face-killer.facing;while(fd>Math.PI)fd-=Math.PI*2;while(fd<-Math.PI)fd+=Math.PI*2;
  const aimed=dist<=CFG.FLASHLIGHT_RANGE&&Math.abs(da)<=CFG.FLASHLIGHT_ANGLE&&Math.abs(fd)<=0.9&&lineOfSightFree(survivor.x,survivor.y,killer.x,killer.y);
  if(!aimed){survivor.flashlightCharge=0;stop();game.hint='Направь свет на лицо убийцы';game.hintTime=0.2;return;}
  survivor.flashlightActive=true;survivor.flashlightCharge=Math.min(3,survivor.flashlightCharge+dt);

  if(survivor.flashlightCharge>=3){killer.blindTimer=CFG.FLASHLIGHT_BLIND_TIME;killer.slowTimer=CFG.FLASHLIGHT_SLOW_TIME;killer.path=null;killer.cautiousTimer=CFG.CAUTIOUS_TIME;survivor.itemCooldown=ITEMS.flashlight.cooldown;survivor.flashlightCharge=0;stop();screenShake=10;game.hint='Убийца ослеплён!';game.hintTime=2;}
}

function tryUseItem(){
  if (selectedItem==='none'||survivor.itemCooldown>0||survivor.state==='healing'||survivor.repairing) return;
  const item=ITEMS[selectedItem]; if(!item.active) return;
  if (selectedItem==='flashlight'){

  } else if (selectedItem==='medkit'){

    survivor.state='healing'; survivor.healTimer=CFG.HEAL_TIME; survivor.itemCooldown=9999;
    game.hint='Лечение...'; game.hintTime=CFG.HEAL_TIME;
  } else if (selectedItem==='smoke'){
    const tx=survivor.x+Math.cos(survivor.facing)*CFG.SMOKE_THROW;
    const ty=survivor.y+Math.sin(survivor.facing)*CFG.SMOKE_THROW;
    smokeClouds.push({x:tx,y:ty,r:CFG.SMOKE_RADIUS,timer:CFG.SMOKE_TIME});
    survivor.itemCooldown=item.cooldown;
    if (Math.hypot(killer.x-tx,killer.y-ty)<CFG.SMOKE_RADIUS){killer.state='blinded';killer.stunTimer=1.5;killer.path=null;}
    game.hint='Дым!'; game.hintTime=1.5;
  } else if (selectedItem==='key'){
    if (!generators.every(g=>g.done)){game.hint='Нужны все генераторы';game.hintTime=1.5;return;}
    let near=null,nd=Infinity;
    for(const e of exitDoors){if(e.opened)continue;const d=Math.hypot(e.x+e.w/2-survivor.x,e.y+e.h/2-survivor.y);if(d<nd){nd=d;near=e;}}
    if (!near||nd>150){game.hint='Подойди к выходу';game.hintTime=1.5;return;}
    near.opened=true; near.openProgress=1; survivor.itemCooldown=9999;
    game.hint='Выход открыт!'; game.hintTime=2;

    const tx=survivor.x+Math.cos(survivor.facing)*200;
    const ty=survivor.y+Math.sin(survivor.facing)*200;
    if (Math.hypot(killer.x-tx,killer.y-ty)<220&&killer.state!=='stunned'&&killer.state!=='blinded'){
      killer.state='blinded'; killer.stunTimer=2; killer.path=null; killer.cautiousTimer=CFG.CAUTIOUS_TIME;
      screenShake=12; game.hint='Петарда!'; game.hintTime=2;
    } else {game.hint='Бросок...';game.hintTime=1;}
    survivor.itemCooldown=item.cooldown;
  }
}

function sync3D(dt){

    if(i<bloodTrail.length&&canTrackBlood){
      const p=bloodTrail[i],distance=Math.hypot(p.x-killer.x,p.y-killer.y);
      const inRange=distance<=CFG.BLOOD_TRAIL_VIEW_DISTANCE;
      const clear=inRange&&lineOfSightFree(killer.x,killer.y,p.x,p.y);
      m.visible=clear;
      if(clear){
        m.position.set(PX(p.x),0.021,PX(p.y));
        const ageFade=Math.max(0,1-(game.time-p.time)/CFG.BLOOD_TRAIL_LIFETIME);
        const distanceFade=Math.max(0.12,1-distance/CFG.BLOOD_TRAIL_VIEW_DISTANCE);
        m.material.opacity=ageFade*distanceFade*0.68;
      }else m.material.opacity=0;
    }else{m.visible=false;m.material.opacity=0;}
  }

  for (let i=0;i<trapMeshes.length;i++){
    if (i<traps.length && traps[i].active){ trapMeshes[i].position.set(PX(traps[i].x), 0, PX(traps[i].y)); trapMeshes[i].visible = true; }
    else trapMeshes[i].visible = false;
  }

  for (let i=0;i<hatchetMeshes.length;i++){
    if (i<hatchets.length){ const h = hatchets[i]; hatchetMeshes[i].position.set(PX(h.x), 0.8, PX(h.y)); hatchetMeshes[i].visible = true; }
    else hatchetMeshes[i].visible = false;
  }

  for (let i=0;i<smokeMeshes.length;i++){
    if (i<smokeClouds.length){
      const c = smokeClouds[i];
      smokeMeshes[i].group.position.set(PX(c.x), 0.5, PX(c.y));
      smokeMeshes[i].group.visible = true;
      const a = Math.min(1, c.timer/1.5) * 0.5;
      smokeMeshes[i].group.children.forEach(s => s.material.opacity = a);
    } else smokeMeshes[i].group.visible = false;
  }

  const target = myIsSurvivor ? survivor : killer;
  const eyeY = myIsSurvivor ? 1.6 : 1.78;
  let camX = PX(target.x), camZ = PX(target.y), camY = eyeY + (sandboxMode && sandboxFlyEnabled ? sandboxFlyHeight : 0);
  if (target.state === 'vaulting') camY += Math.sin((target.vaultTimer/target.vaultDuration) * Math.PI) * 0.6;
  camera3d.position.set(camX, camY, camZ);
  const pitch = target.pitch || 0, yaw = target.facing;
  const cp = Math.cos(pitch);
  camera3d.lookAt(camX + Math.cos(yaw)*cp, camY + Math.sin(pitch), camZ + Math.sin(yaw)*cp);

  if (sunLight && sunLight.target){
    sunLight.position.set(camera3d.position.x + 15, 40, camera3d.position.z + 15);
    sunLight.target.position.set(camera3d.position.x, 0, camera3d.position.z);
    sunLight.target.updateMatrixWorld();
  }

  if (screenShake > 0){
    camera3d.position.x += (Math.random()-0.5) * screenShake * 0.05;
    camera3d.position.y += (Math.random()-0.5) * screenShake * 0.05;
    screenShake = Math.max(0, screenShake - dt*60);
  }
}

function updateHUD(){
  const roleText = document.getElementById('roleText');
  if (roleText){ roleText.textContent = playerRole === 'survivor' ? 'ВЫЖИВШИЙ' : 'УБИЙЦА'; roleText.className = 'hud-value ' + (playerRole === 'survivor' ? 'blue' : 'red'); }
  const hp=document.getElementById('hpText');
  if (hp){ hp.textContent = survivor.health==='injured'?'РАНЕН':'ЗДОРОВ'; hp.className='hud-value '+(survivor.health==='injured'?'red':'green'); }
  const genRow=document.getElementById('genRow');
  if (genRow){
    if (genRow.children.length===0) for(let i=0;i<CFG.GENERATOR_COUNT;i++){const d=document.createElement('div');d.className='gen-dot';genRow.appendChild(d);}
    for(let i=0;i<CFG.GENERATOR_COUNT;i++){const g=generators[i],d=genRow.children[i];if(d)d.className='gen-dot'+(g.done?' done':(g.progress>0?' partial':''));}
  }
  const tt=document.getElementById('totemText');
  if (tt){ tt.textContent=totem.broken?'СЛОМАН':'ЦЕЛ'; tt.className='hud-value '+(totem.broken?'green':'blue'); }
  const kt=document.getElementById('killerText');
  if (kt){
    const ab=KILLER_ABILITIES[killerAbilityKey];
    let s=killer.state.toUpperCase();
    if (killer.state==='idle') s='ПАТРУЛЬ';
    else if (killer.state==='stunned') s='ОГЛУШЁН';
    else if (killer.state==='blinded'||killer.blindTimer>0) s='ОСЛЕПЛЁН';
    else if (killer.slowTimer>0) s='ЗАМЕДЛЕН';
    else if (killer.state==='breaking') s='ЛОМАЕТ';
    else if (killer.state==='dashing') s='РЫВОК';
    else if (killer.state==='chainsaw_dash') s='ПИЛА';
    kt.textContent=ab.icon+' '+s; kt.className='hud-value red';
  }
  const tm=document.getElementById('timeText'); if(tm)tm.textContent=game.time.toFixed(1)+' с';
  const hint=document.getElementById('hint');
  if (hint){ if(game.hintTime>0&&game.hint){hint.textContent=game.hint;hint.classList.add('show');}else hint.classList.remove('show'); }

  const bottom = document.getElementById('bottom');
  if (bottom){
    if (playerRole === 'survivor') bottom.textContent = 'ЛКМ — захват мыши · WASD — движение · E — действие · Space — способность · F — предмет · Esc — пауза';
    else bottom.textContent = 'ЛКМ — атака/захват мыши · WASD — движение · Space — способность · E — перелезть/сломать · Esc — пауза';
  }

  crosshair.classList.toggle('show', game.screen === 'playing' && document.pointerLockElement === canvas && (!sandboxMode || sandboxHudVisible));
  if(camera3d&&camera3d.userData.flashlightLight&&playerRole==='survivor')camera3d.userData.flashlightLight.intensity=survivor.flashlightActive?1.8:0;
  if(camera3d&&camera3d.userData.flashlightBeam)camera3d.userData.flashlightBeam.visible=playerRole==='survivor'&&survivor.flashlightActive;
  const blindOverlay=document.getElementById('blind-effect');
  if(blindOverlay){const active=playerRole==='killer'&&killer.blindTimer>0&&game.screen==='playing';blindOverlay.style.opacity=active?String(Math.min(0.9,0.38+killer.blindTimer/8)):'0';blindOverlay.style.backdropFilter=active?'blur('+Math.min(7,killer.blindTimer*1.6)+'px) grayscale(.7)':'none';}

  const ind = document.getElementById('mp-indicator');
  if (MP.active){
    ind.style.display = 'block';
    if (!MP.connected) ind.textContent = MP.role === 'host' ? 'ХОСТ · ожидание' : 'ГОСТЬ · подключение…';
    else ind.textContent = (MP.role === 'host' ? 'ХОСТ' : 'ГОСТЬ') + ' · ' + MP.roomCode;
    ind.style.color = MP.connected ? '#88ffaa' : '#ffaa44';
  } else {
    ind.style.display = 'none';
  }
}

  if(!sandboxMode||!sandboxKillerActive)return;
  sandboxKillerFrozen=!sandboxKillerFrozen;
  if(sandboxKillerFrozen){killer.state='idle';killer.isMoving=false;killer.path=null;killer.attackLungeTimer=0;killer.attackChargeTimer=0;killer.attackAnimTimer=0;}
  refreshSandboxAdmin();
  sandboxAdminMessage(sandboxKillerFrozen?'Киллер заморожен.':'Киллер разморожен.');
};

function resetGame(){
  survivor.x=150; survivor.y=150; survivor.state='idle';
  survivor.vaultTimer=0; survivor.vaultCooldown=0; survivor.facing=0; survivor.pitch=0; survivor.walkPhase=0;
  survivor.abilityCooldown=0; survivor.speedBoostTimer=0; survivor.vaultBoostTimer=0;
  survivor.invisibleTimer=0; survivor.invulnerableTimer=0;
  survivor.itemCooldown=0; survivor.itemUsed=false; survivor.hitOnce=false; survivor.slowTimer=0;survivor.flashlightCharge=0;survivor.flashlightActive=false;
  survivor.health='healthy'; survivor.hitCooldown=0; survivor.healTimer=0; survivor.bloodTimer=0;survivor.animEvent='idle';survivor.animTimer=0;survivor.isMoving=false;
  survivor.noTrailTimer=0; survivor.litheTimer=0; survivor.trailTimer=0;
  survivor.repairing=null; survivor.repairTimer=0; survivor.isInChase=false; survivor.vx=0; survivor.vy=0;

  killer.x=2250; killer.y=1450; killer.state='idle';
  killer.stunTimer=0; killer.breakTimer=0; killer.breakTarget=null; killer.attackCooldown=0;killer.attackRecoveryTimer=0;killer.attackHitTimer=0;killer.attackHitPending=false;killer.blindTimer=0;killer.slowTimer=0;killer.attackHeldPrev=false;killer.attackChargeTimer=0;killer.attackLungeTimer=0;killer.attackAnimTimer=0;killer.attackAnimType='';killer.animEvent='idle';killer.animTimer=0;
  killer.vaultTimer=0; killer.facing=Math.PI; killer.pitch=0; killer.walkPhase=0;
  killer.path=null; killer.pathTimer=0; killer.stuckTimer=0; killer.palletStuckTimer=0;
  killer.dashCooldown=0; killer.dashWindupTimer=0; killer.dashTimer=0;
  killer.rageTimer=0; killer.hastenTimer=0; killer.butcherTimer=0;
  killer.lastSeen=null; killer.lastSeenTime=-999; killer.searchTarget=null;
  killer.trapCooldown=0; killer.chainsawCooldown=0; killer.hatchetCooldown=0; killer.blinkCooldown=0;
  killer.invisibleTimer=0; killer.invisibleCooldown=0; killer.abilityDisabledTimer=0;
  killer.bloodlust=0; killer.bloodlustTimer=0;
  killer.instinctTimer=CFG.KILLER_INSTINCT_INTERVAL; killer.instinctActive=0;
  killer.cautiousTimer=0; killer.chaseCommitTimer=0;

  for(const p of pallets){p.state='upright';p.fallTimer=0;p.breakTimer=0;p.visualAngle=Math.PI/2.1;}
  for(const win of windows){win.vaultTimestamps=[];win.blockedTimer=0;}
  for(const g of generators){g.progress=0;g.done=false;}
  totem.broken=false; totem.progress=0;
  for(const e of exitDoors){e.opened=false;e.openProgress=0;}
  smokeClouds.length=0; bloodTrail.length=0; traps.length=0; hatchets.length=0;
  screenShake=0; costMap=null;

  game.time=0;MP.remotePrevSpace=false;
  game.hint = playerRole === 'survivor' ? 'Починить 3 генератора и сбежать!' : 'Найди выжившего и поймай!';
  game.hintTime=6;
}
function beginPlaying(){
  sandboxMode = false; sandboxHudVisible = true;
  document.getElementById('hud').style.display = '';
  document.getElementById('crosshair').style.display = '';
  resetGame();
  if (MP.active) {
    playerRole = MP.myRole;
  }
  document.getElementById('sandbox-admin')?.classList.remove('show');
  sandboxFlyEnabled=false; sandboxFlyHeight=0; sandboxKillerActive=false; sandboxKillerFrozen=false;
  game.screen = 'playing';
  hideScreen();
  snapCamera();
  log('Игра началась. Роль: ' + playerRole);
}
function restartGame(){
  if (MP.active && MP.role === 'guest') return;
  pickKillerAbility();
  beginPlaying();
}

let lastT = performance.now();
let firstFrame = false;
function loop(now){
  try {
    let dt = (now - lastT) / 1000;
    lastT = now;
    dt = Math.min(dt, 0.05);

    if (game.screen === 'killer_reveal' && performance.now() - revealStartTime > 8000) beginPlaying();

    if (sandboxMode && game.screen === 'playing') {
      game.time += dt;
      if (game.hintTime > 0) game.hintTime -= dt;
      const pInput = {w:!!keys['w'],a:!!keys['a'],s:!!keys['s'],d:!!keys['d'],space:!!keys[' '],e:!!keys['e'],f:!!keys['f'],attack:false};
      const spaceEdge = pInput.space && !prevSpace;
      const eEdge = pInput.e && !prevE;
      const fEdge = pInput.f && !prevF;
      prevSpace=pInput.space; prevE=pInput.e; prevF=pInput.f;
      updateSurvivorInput(dt,pInput);
      if(sandboxFlyEnabled){ sandboxFlyHeight=Math.max(0,Math.min(10,sandboxFlyHeight+((keys[' ']?1:0)-(keys['shift']?1:0))*dt*4)); }
      if(eEdge) tryInteractSingle();
      if(pInput.e) tryInteractHold(pInput,dt); else { survivor.repairing=null; survivor.repairTimer=0; }
      if(spaceEdge&&!sandboxFlyEnabled) tryAbility();
      if(selectedItem==='flashlight') updateFlashlight(dt,pInput.f); else if(fEdge) tryUseItem();
      if(sandboxKillerActive&&!sandboxKillerFrozen) updateKillerAI(dt);
      updatePallets(dt); updateWindows(dt); updateSmoke(dt); updateTraps(dt); updateHatchets(dt); updateBloodTrail(dt);
    } else if (MP.active && MP.role === 'guest') {
      sendInput();
      if (game.hintTime > 0) game.hintTime -= dt;
    } else if (game.screen === 'playing') {
      game.time += dt;
      if (game.hintTime > 0) game.hintTime -= dt;

      let pInput = {
        w: !!keys['w'], a: !!keys['a'], s: !!keys['s'], d: !!keys['d'],
        space: !!keys[' '], e: !!keys['e'], f: !!keys['f'],
        attack: mouseDown,
      };
      const spaceEdge = pInput.space && !prevSpace;
      const eEdge = pInput.e && !prevE;
      const fEdge = pInput.f && !prevF;
      prevSpace = pInput.space; prevE = pInput.e; prevF = pInput.f;

      let guestInput = null, guestSpaceEdge = false;
      if (MP.active && MP.role === 'host' && MP.remoteInput) {
        const ri = MP.remoteInput;
        guestInput = {
          w: !!ri.w, a: !!ri.a, s: !!ri.s, d: !!ri.d,
          space: !!ri.space, e: !!ri.e, f: !!ri.f,
          attack: !!ri.attack,
        };
        guestSpaceEdge=!!guestInput.space&&!MP.remotePrevSpace;
        MP.remotePrevSpace=!!guestInput.space;
        const guestRole = MP.myRole === 'survivor' ? 'killer' : 'survivor';
        const gt = guestRole === 'survivor' ? survivor : killer;
        if (ri.yawDelta) gt.facing += ri.yawDelta;
        if (ri.pitchDelta) gt.pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, (gt.pitch || 0) + ri.pitchDelta));
      }

      if (playerRole === 'survivor') {
        updateSurvivorInput(dt, pInput);
        if (eEdge) tryInteractSingle();
        if (pInput.e) tryInteractHold(pInput,dt); else { survivor.repairing=null; survivor.repairTimer=0; }
        if (spaceEdge) tryAbility();
        if(selectedItem==='flashlight')updateFlashlight(dt,pInput.f);else if(fEdge)tryUseItem();
        if (MP.active && MP.role === 'host' && guestInput) {
          updateKillerPlayer(dt, guestInput);
          if (guestSpaceEdge) killerUseAbility();
        } else {
          updateKillerAI(dt);
        }
      } else {
        updateKillerPlayer(dt, pInput);
        if (spaceEdge) killerUseAbility();
        if (MP.active && MP.role === 'host' && guestInput) {
          updateSurvivorInput(dt, guestInput);
          if (guestSpaceEdge) tryAbility();
          if(selectedItem==='flashlight')updateFlashlight(dt,guestInput.f);else if(guestInput.f)tryUseItem();
          if (guestInput.e) {
            if (!survivor.repairing) tryInteractSingle();
            tryInteractHold(guestInput,dt);
          } else { survivor.repairing = null; survivor.repairTimer=0; }
        } else {
          updateSurvivorAI(dt);
        }
      }

      killer.blindTimer=Math.max(0,killer.blindTimer-dt);killer.slowTimer=Math.max(0,killer.slowTimer-dt);killer.attackAnimTimer=Math.max(0,killer.attackAnimTimer-dt);
      survivor.animTimer=Math.max(0,(survivor.animTimer||0)-dt);killer.animTimer=Math.max(0,(killer.animTimer||0)-dt);
      updatePallets(dt); updateWindows(dt); updateSmoke(dt);
      updateTraps(dt); updateHatchets(dt); updateBloodTrail(dt);
      checkWin();
      if (MP.active && MP.role === 'host') broadcastState();
    }

    if (threeReady && renderer && scene && camera3d) {
      sync3D(dt);
      renderer.render(scene, camera3d);
      if (!firstFrame){ firstFrame = true; log('Первый кадр'); }
    }
    updateHUD();
  } catch (err) {
    err._dbdHandled = true;
    fatal('Ошибка в цикле', err);
    return;
  }
  requestAnimationFrame(loop);
}

function loadThree(){
  return new Promise((resolve, reject) => {
    if (window.THREE){ THREE = window.THREE; return resolve(); }
    const sources = [
      'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
      'https://unpkg.com/three@0.128.0/build/three.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    ];
    let idx = 0;
    const statusEl = document.getElementById('loadStatus');
    function tryNext(){
      if (idx >= sources.length) return reject(new Error('Не удалось загрузить Three.js'));
      const url = sources[idx++];
      if (statusEl) statusEl.textContent = 'Three.js (' + idx + '/' + sources.length + ')';
      const s = document.createElement('script');
      s.src = url; s.async = true;
      s.onload = () => { if (window.THREE){ THREE = window.THREE; resolve(); } else tryNext(); };
      s.onerror = () => tryNext();
      document.head.appendChild(s);
    }
    tryNext();
  });
}

window.addEventListener('load', async () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get('room');
    
    await loadThree();
    document.getElementById('loadStatus').textContent = 'Инициализация 3D…';
    initThree();
    document.getElementById('loading').classList.add('hidden');
    lastT = performance.now();
    
    if (roomParam) {
      showMPJoinScreen(roomParam.toLowerCase());
      setTimeout(() => window.__doJoin(), 100);
    } else {
      showMainMenu();
    }
    requestAnimationFrame(loop);
  } catch (err){
    err._dbdHandled = true;
    fatal('Ошибка инициализации', err);
  }
});
